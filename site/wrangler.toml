# Cloudflare Pages project for cars.allo.land
name = "alloland-cars"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Data collected by .github/workflows/collect-charging-data.yml.
# Only keys under public/ are served (see functions/data/[[path]].js).
[[r2_buckets]]
binding = "DATA"
bucket_name = "spikinglabs-cars-charging-data"
