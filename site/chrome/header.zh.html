<header class="ac-top">
  <a class="ac-appbar__brand" href="/zh/">Allo <span>Cars</span></a>
  <nav class="ac-topnav" aria-label="Allo Cars">
    <a href="/zh/">工具</a>
    <a href="/zh/cars/">我的车</a>
    <a href="/zh/compare/">对比</a>
    <a href="/zh/chargers/">充电桩地图</a>
    <a href="/zh/ev-cost/">充电成本</a>
    <a href="/zh/charging-prices/">价格档案</a>
    <a href="/zh/charge-times/">充电时段</a>
    <a href="/zh/recalls/">召回</a>
    <a href="/zh/fuel-prices/">油价</a>
  </nav>
  <div class="ac-top__right">
    <button type="button" class="ac-iconbtn" popovertarget="ac-find" aria-controls="ac-find" aria-label="找车" title="找车 (/)" data-count="find_open"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    {{langswitch}}
    <button type="button" class="ac-iconbtn" data-theme-flip aria-label="切换浅色或深色" title="切换浅色或深色"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
</header>
<div class="ac-find" id="ac-find" popover role="dialog" aria-label="找车">
  <form class="ac-find__form" action="/zh/car/" role="search" data-find>
    <label class="ac-find__box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input type="search" name="q" placeholder="品牌和车型，例如 大众 ID.3" aria-label="找车" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label>
    <button type="button" class="ac-iconbtn" popovertarget="ac-find" popovertargetaction="hide" aria-label="关闭" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <ul class="ac-find__list" data-find-list role="listbox" aria-label="找车" hidden></ul>
  </form>
</div>
<script src="/assets/search.js" defer></script>
<aside class="ac-apphint" data-app-hint hidden>
  <span class="ac-apphint__text" data-app-hint-text>可以把 Allo Cars 添加到主屏幕，像 App 一样使用。</span>
  <button type="button" class="ac-apphint__go" data-app-hint-go hidden>安装</button>
  <button type="button" class="ac-apphint__x" data-app-hint-x aria-label="关闭">×</button>
</aside>
