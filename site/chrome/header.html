<header class="ac-top">
  <a class="ac-appbar__brand" href="/">Allo <span>Cars</span></a>
  <nav class="ac-topnav" aria-label="Allo Cars">
    <a href="/">Tools</a>
    <a href="/cars/">My cars</a>
    <a href="/compare/">Compare</a>
    <a href="/chargers/">Charger map</a>
    <a href="/ev-cost/">Charging cost</a>
    <a href="/charging-prices/">Price archive</a>
    <a href="/charge-times/">Best time</a>
    <a href="/recalls/">Recalls</a>
    <a href="/fuel-prices/">Fuel prices</a>
  </nav>
  <div class="ac-top__right">
    <button type="button" class="ac-iconbtn" popovertarget="ac-find" aria-controls="ac-find" aria-label="Find a car" title="Find a car (/)" data-count="find_open"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    {{langswitch}}
    <button type="button" class="ac-iconbtn" data-theme-flip aria-label="Switch light or dark" title="Switch light or dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
</header>
<div class="ac-find" id="ac-find" popover role="dialog" aria-label="Find a car">
  <form class="ac-find__form" action="/car/" role="search" data-find>
    <label class="ac-find__box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input type="search" name="q" placeholder="Make and model, e.g. VW ID.3" aria-label="Find a car" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label>
    <button type="button" class="ac-iconbtn" popovertarget="ac-find" popovertargetaction="hide" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <ul class="ac-find__list" data-find-list role="listbox" aria-label="Find a car" hidden></ul>
  </form>
</div>
<script src="/assets/search.js" defer></script>
<aside class="ac-apphint" data-app-hint hidden>
  <span class="ac-apphint__text" data-app-hint-text>Add Allo Cars to your home screen, it works like an app.</span>
  <button type="button" class="ac-apphint__go" data-app-hint-go hidden>Install</button>
  <button type="button" class="ac-apphint__x" data-app-hint-x aria-label="Dismiss">×</button>
</aside>
