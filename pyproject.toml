[project]
name = "car-mcp"
version = "0.1.0"
description = "An AI-native car logbook: fuel, charging, maintenance, expenses and dashboards over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
car-mcp = "car_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_mcp"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]
