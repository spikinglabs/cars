name: Collect car registrations

# Monthly new car registrations by brand and model from the KBA (FZ10) into R2
# (registrations/). The KBA publishes a new month about a week after it ends; a daily
# check finds it soon after. Only new or revised months are downloaded, 30 s apart as the
# KBA's robots.txt asks, so the first run (every month since Dec 2018) takes about 50 minutes.
on:
  # Started on time by the Cloudflare cron Worker in workers/collect-cron (GitHub drops many
  # scheduled runs); its SCHEDULE says when.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-registrations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET_EV }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/charging_prices/requirements.txt -r pipelines/registrations/requirements.txt
      - name: Check bucket variable
        run: test -n "$R2_BUCKET" || { echo "::error::Set the R2_BUCKET_EV repository variable"; exit 1; }
      - run: python -m pipelines.registrations.collect --r2 "$R2_BUCKET" --prefix registrations
      # Job status for the DataHerb catalog (dataherb.status/v1), served at
      # https://cars.allo.land/data/registrations/status/de-new-car-registrations/latest.json. Only scheduled (dispatched) runs and main write it; never fails the run.
      - name: Write DataHerb job status
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        continue-on-error: true
        uses: DataHerb/dataherb-explorer/.github/actions/emit-status@main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        with:
          target: s3://${{ env.R2_BUCKET }}/registrations/public/status/
          job-id: de-new-car-registrations
          status: ${{ job.status }}
          expected-interval: P1D
          datasets: de-new-car-registrations
