name: Collect chargers

# Public charge points in Germany from the Bundesnetzagentur Ladesäulenregister into R2 (chargers/),
# for the charger map at /chargers/. The register is published a few times a year; a daily check
# rebuilds the map files only when a newer file appears (about 1 minute, ~230 small files).
# It also runs on pull requests that change the pipeline, so the site preview has data to show.
on:
  pull_request:
    paths: ["pipelines/chargers/**", ".github/workflows/collect-chargers.yml"]
  # Started on time by the Cloudflare cron Worker in workers/collect-cron (GitHub drops many
  # scheduled runs); its SCHEDULE says when.
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the newest register file was published already"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-chargers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs get no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET_EV }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/chargers/requirements.txt
      - name: Check bucket variable
        run: test -n "$R2_BUCKET" || { echo "::error::Set the R2_BUCKET_EV repository variable"; exit 1; }
      - run: python -m pipelines.chargers.collect --r2 "$R2_BUCKET" --prefix chargers ${{ inputs.force && '--force' || '' }}
