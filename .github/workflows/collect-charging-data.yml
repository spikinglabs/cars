name: Collect charging data

# Snapshots German EV charging prices and charger status into Cloudflare R2.
# See pipelines/charging_prices/collect.py for what each tier stores.
on:
  # Started on time by the Cloudflare cron Worker in workers/collect-cron (GitHub drops many
  # scheduled runs); its SCHEDULE says when.
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        options: [hourly, daily, weekly]
        default: hourly

permissions:
  contents: read

concurrency:
  group: collect-${{ inputs.tier || 'hourly' }}
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET_EV }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/charging_prices/requirements.txt
      - name: Collect
        run: python -m pipelines.charging_prices.collect --tier ${{ inputs.tier || 'hourly' }} --r2 "$R2_BUCKET" --prefix charging-prices
