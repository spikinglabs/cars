name: Collect charging data

# Snapshots German EV charging prices and charger status into Cloudflare R2.
# See pipelines/charging_prices/collect.py for what each tier stores.
on:
  schedule:
    - cron: "7 * * * *"    # hourly: prices + charger status
    - cron: "23 3 * * *"   # daily: Bundesnetzagentur register + storage check
    - cron: "41 4 * * 1"   # weekly (Monday): locations + businesses
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        options: [hourly, daily, weekly]
        default: hourly

permissions:
  contents: read
  actions: write # keepalive: re-enable this scheduled workflow

concurrency:
  group: collect-${{ github.event.schedule || inputs.tier }}
  cancel-in-progress: false

env:
  R2_BUCKET: spikinglabs-cars-charging-data
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/charging_prices/requirements.txt
      - name: Pick tier
        id: tier
        run: |
          case "${{ github.event.schedule }}" in
            "23 3 * * *") echo "tier=daily" >> "$GITHUB_OUTPUT" ;;
            "41 4 * * 1") echo "tier=weekly" >> "$GITHUB_OUTPUT" ;;
            "") echo "tier=${{ inputs.tier }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "tier=hourly" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Collect
        run: python -m pipelines.charging_prices.collect --tier ${{ steps.tier.outputs.tier }} --r2 "$R2_BUCKET"
      - name: Keep schedule alive
        # GitHub disables schedules after 60 days without repo activity.
        if: steps.tier.outputs.tier == 'daily'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect-charging-data.yml/enable"
