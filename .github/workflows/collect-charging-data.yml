name: Collect charging data

# Snapshots German EV charging prices and charger status into Cloudflare R2.
# See pipelines/charging_prices/collect.py for what each tier stores.
on:
  # Started on time by the Cloudflare cron Worker in workers/collect-cron (GitHub drops many
  # scheduled runs); its SCHEDULE says when.
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        options: [hourly, daily, weekly]
        default: hourly

permissions:
  contents: read

concurrency:
  group: collect-${{ inputs.tier || 'hourly' }}
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET_EV }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/charging_prices/requirements.txt
      - name: Collect
        run: python -m pipelines.charging_prices.collect --tier ${{ inputs.tier || 'hourly' }} --r2 "$R2_BUCKET" --prefix charging-prices
      # Job status for the DataHerb catalog (dataherb.status/v1), served at
      # https://cars.allo.land/data/charging-prices/status/ev-charging-prices/latest.json. Only scheduled (dispatched) runs and main write it; never fails the run.
      - name: Write DataHerb job status
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && (inputs.tier || 'hourly') == 'hourly'
        continue-on-error: true
        uses: DataHerb/dataherb-explorer/.github/actions/emit-status@main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        with:
          target: s3://${{ env.R2_BUCKET }}/charging-prices/public/status/
          job-id: ev-charging-prices
          status: ${{ job.status }}
          expected-interval: PT2H
          datasets: ev-charging-prices
