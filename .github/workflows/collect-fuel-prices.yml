name: Collect fuel prices

# Weekly German petrol, diesel and LPG prices from the EU Weekly Oil Bulletin
# into R2 (fuel-prices/). The bulletin updates once a week; a daily check
# catches it soon after, and the raw workbook is stored only when it changed.
on:
  # Started on time by the Cloudflare cron Worker in workers/collect-cron (GitHub drops many
  # scheduled runs); its SCHEDULE says when.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-fuel-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET_ICE }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/charging_prices/requirements.txt -r pipelines/fuel_prices/requirements.txt
      - name: Check bucket secret
        run: test -n "$R2_BUCKET" || { echo "::error::Set the R2_BUCKET_ICE repository variable"; exit 1; }
      - run: python -m pipelines.fuel_prices.collect --r2 "$R2_BUCKET" --prefix fuel-prices
      # Job status for the DataHerb catalog (dataherb.status/v1), served at
      # https://cars.allo.land/data/fuel-prices/status/eu-fuel-prices/latest.json. Only scheduled (dispatched) runs and main write it; never fails the run.
      - name: Write DataHerb job status
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        continue-on-error: true
        uses: DataHerb/dataherb-explorer/.github/actions/emit-status@main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        with:
          target: s3://${{ env.R2_BUCKET }}/fuel-prices/public/status/
          job-id: eu-fuel-prices
          status: ${{ job.status }}
          expected-interval: P1D
          datasets: eu-fuel-prices
