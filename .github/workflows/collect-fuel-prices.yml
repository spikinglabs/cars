name: Collect fuel prices

# Weekly German petrol, diesel and LPG prices from the EU Weekly Oil Bulletin
# into R2 (fuel-prices/). The bulletin updates once a week; a daily check
# catches it soon after, and the raw workbook is stored only when it changed.
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-fuel-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET_ICE || 'spikikinglabs-cars-ice' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/charging_prices/requirements.txt -r pipelines/fuel_prices/requirements.txt
      - run: python -m pipelines.fuel_prices.collect --r2 "$R2_BUCKET" --prefix fuel-prices
