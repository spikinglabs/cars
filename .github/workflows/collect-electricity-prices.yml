name: Collect electricity prices

# German day-ahead exchange prices from SMARD (Bundesnetzagentur) into R2 (electricity-prices/ in the
# shared EV bucket), for the cheapest time to charge at home. Tomorrow's prices are published around
# 13:00 German time, so the job runs every hour in the afternoon and once after midnight.
on:
  # Started on time by the Cloudflare cron Worker in workers/collect-cron (GitHub drops many
  # scheduled runs); its SCHEDULE says when.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-electricity-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET_EV }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/charging_prices/requirements.txt
      - name: Check bucket variable
        run: test -n "$R2_BUCKET" || { echo "::error::Set the R2_BUCKET_EV repository variable"; exit 1; }
      - run: python -m pipelines.electricity_prices.collect --r2 "$R2_BUCKET" --prefix electricity-prices
      # Job status for the DataHerb catalog (dataherb.status/v1), served at
      # https://cars.allo.land/data/electricity-prices/status/de-day-ahead-electricity-prices/latest.json. Never fails the run.
      - name: Write DataHerb job status
        if: always()
        continue-on-error: true
        uses: DataHerb/dataherb-explorer/.github/actions/emit-status@main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        with:
          target: s3://${{ env.R2_BUCKET }}/electricity-prices/public/status/
          job-id: de-day-ahead-electricity-prices
          status: ${{ job.status }}
          expected-interval: P1D
          datasets: de-day-ahead-electricity-prices
