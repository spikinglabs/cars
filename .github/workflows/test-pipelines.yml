name: Test pipelines

on:
  pull_request:
    paths: ["pipelines/**"]
  push:
    branches: [main]
    paths: ["pipelines/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/fuel_prices/requirements.txt -r pipelines/chargers/requirements.txt
      - run: python -m unittest discover -s pipelines/charging_prices/tests -t . -v
      - run: python -m unittest discover -s pipelines/fuel_prices/tests -t . -v
      - run: python -m unittest discover -s pipelines/recalls/tests -t . -v
      - run: python -m unittest discover -s pipelines/electricity_prices/tests -t . -v
      - run: python -m unittest discover -s pipelines/registrations/tests -t . -v
      - run: python -m unittest discover -s pipelines/chargers/tests -t . -v
