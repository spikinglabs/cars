name: Test pipelines

on:
  pull_request:
    paths: ["pipelines/**"]
  push:
    branches: [main]
    paths: ["pipelines/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s pipelines/charging_prices/tests -t . -v
